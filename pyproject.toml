[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "soc-automation"
version = "1.3.0"
description = "SOC automation tools: alert triage, IOC enrichment, SOAR integration, and metrics reporting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["soc", "security", "automation", "siem", "detection", "soar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",         # coloured terminal output
    "click>=8.1.0",         # CLI entrypoints
    "httpx>=0.27.0",        # async HTTP (used in SOAR)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",         # TestClient for FastAPI
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
soc-triage  = "auto_triage:main"
soc-enrich  = "enrich_ioc:main"
soc-metrics = "weekly_metrics:main"
soc-soar    = "soar.webhook_listener:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
